<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookings</title>

<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}
header {
    background: #172554;
    color: white;
    padding: 25px;
}
.container {
    max-width: 850px;
    margin: 30px auto;
    padding: 20px;
}
.stats {
    display: flex;
    gap: 20px;
    margin: 25px 0;
}
.stat {
    flex: 1;
    background: white;
    border-radius: 12px;
    padding: 20px;
}
.ticket {
    background: white;
    border-left: 5px solid #16a34a;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px #00000010;
}
.status {
    color: #15803d;
    font-weight: bold;
}
a, button {
    display: inline-block;
    background: #2563eb;
    color: white;
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    text-decoration: none;
    cursor: pointer;
}
#error { color: #dc2626; }
</style>
<link rel="stylesheet" href="/booking/style.css"><style id="responsive-styles">

* {
    box-sizing: border-box;
}

img {
    max-width: 100%;
    height: auto;
}

#seats {
    max-width: 100%;
    overflow-x: auto;
}

@media (max-width: 768px) {

    body {
        margin: 0;
        padding: 15px;
    }

    .container {
        width: 100%;
        max-width: 100%;
        padding: 12px;
    }

    h1 {
        font-size: 24px;
    }

    h2 {
        font-size: 20px;
    }

    button {
        min-height: 44px;
        max-width: 100%;
    }

    .action {
        width: 100%;
        margin-bottom: 10px;
    }

    input, select {
        max-width: 100%;
    }
}

@media (max-width: 480px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 20px;
    }

    #seats {
        padding: 5px;
    }

}

</style>
</head>

<body>

<header>
    <h2>EVENT MANAGEMENT SYSTEM</h2>
    My Bookings
</header>

<div class="container">
    <h1>Your Tickets</h1>

    <a href="/booking/">Book Another Seat</a>
    <button onclick="loadBookings()">Refresh</button>

    <div class="stats">
        <div class="stat">
            Total Bookings
            <h2 id="count">0</h2>
        </div>

        <div class="stat">
            Total Amount
            <h2 id="amount">Rs. 0</h2>
        </div>
    </div>

    <p id="error"></p>
    <div id="bookings"></div>
</div>

<script>

async function loadBookings() {
    const area = document.getElementById("bookings");
    const errorBox = document.getElementById("error");

    area.replaceChildren();
    errorBox.textContent = "";

    try {
        const response = await fetch(
            "/api/bookings/user/1",
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("Unable to load bookings");
        }

        const bookings = await response.json();

        const uniqueBookings = new Map(
            bookings.map(b => [b.booking_id, b])
        );

        document.getElementById("count").textContent =
            uniqueBookings.size;

        document.getElementById("amount").textContent =
            "Rs. " + [...uniqueBookings.values()].reduce(
                (sum, b) => sum + Number(b.total_amount), 0
            ).toFixed(2);

        if (!bookings.length) {
            area.textContent = "No bookings found.";
            return;
        }

        bookings.forEach(b => {
            const card = document.createElement("div");
            card.className = "ticket";

            const fields = [
                ["Event", b.event_name],
                ["Venue", b.venue],
                ["Booking ID", b.booking_id],
                ["Seat", b.seat_number],
                ["Category", b.category],
                ["Amount", "Rs. " + b.total_amount],
                ["Status", b.status]
            ];

            fields.forEach(([label, value]) => {
                const line = document.createElement("p");
                line.textContent = label + ": " + value;

                if (label === "Status") {
                    line.className = "status";
                }

                card.appendChild(line);
            });

            area.appendChild(card);
        });

    } catch (error) {
        errorBox.textContent = error.message;
    }
}

loadBookings();

</script>
</body>
</html>
